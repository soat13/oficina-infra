name: CI
on:
  push:
    branches:
      - feature/*

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fiap-soat-fase2:latest

  deploy_infra:
    name: Deploy Infra
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Placeholder for Deploy Infra
        run: echo "Deploying infrastructure..."

  publish:
    name: Publish Application
    runs-on: ubuntu-latest
    needs: deploy_infra
    steps:
      - name: Placeholder for Publish Application
        run: echo "Publishing application..."

  deploy_dev:
    name: Promocao de ambiente
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Placeholder for Promote
        run: echo "Promoting application..."

  deploy_hom:
    name: Promocao de ambiente
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Placeholder for Promote
        run: echo "Promoting application..."

  deploy_prod:
    name: Promocao de ambiente
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Placeholder for Promote
        run: echo "Promoting application..."
  