apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: appgo
  namespace: fiap
spec:
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 30
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: appgo
status:
  currentMetrics: null
  desiredReplicas: 0
